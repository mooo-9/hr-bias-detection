    function computeSentiment(text) {
      const lower = text.toLowerCase();
      const words = lower.match(/\b\w+\b/g) || [];
      const posCount = words.filter(w => POSITIVE_WORDS.includes(w)).length;
      const negCount = words.filter(w => NEGATIVE_WORDS.includes(w)).length;
      if (words.length === 0) return 0;
      return Math.max(-1, Math.min(1, (posCount - negCount) / words.length * 5));
    }

    function analyzeNLP(text) {
      const flags = [];
      for (const [biasType, config] of Object.entries(BIAS_DICT)) {
        for (const word of config.words) {
          const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(`\\b${escaped}\\b`, 'gi');
          let match;
          while ((match = regex.exec(text)) !== null) {
            const categoryWeight = { gendered_female: 4, personality_focus: 3, vague_language: 2, recency_bias: 1 };
            const newFlag = {
              phrase: match[0],
              startIndex: match.index,
              endIndex: match.index + match[0].length,
              type: biasType,
              label: config.label,
              color: config.color,
              borderColor: config.borderColor,
              explanation: config.explanation,
            };
            const existingIdx = flags.findIndex(f => f.startIndex === match.index);
            if (existingIdx === -1) {
              flags.push(newFlag);
            } else if ((categoryWeight[biasType] || 0) > (categoryWeight[flags[existingIdx].type] || 0)) {
              flags[existingIdx] = newFlag;
            }
          }
        }
      }
      flags.sort((a, b) => a.startIndex - b.startIndex);

      const counts = {};
      flags.forEach(f => { counts[f.type] = (counts[f.type] || 0) + 1; });
      const biasScore = Math.min(100,
        (counts.gendered_female   || 0) * 20 +
        (counts.personality_focus || 0) * 15 +
        (counts.vague_language    || 0) * 10 +
        (counts.recency_bias      || 0) * 8
      );

      let biasType = 'None';
      if (counts.gendered_female > 0 || counts.personality_focus > 0) biasType = 'Demographic / Cognitive';
      else if (counts.vague_language > 0 || counts.recency_bias > 0) biasType = 'Cognitive';

      const lower = text.toLowerCase();
      const words = lower.match(/\b\w+\b/g) || [];
      const posCount = words.filter(w => POSITIVE_WORDS.includes(w)).length;
      const negCount = words.filter(w => NEGATIVE_WORDS.includes(w)).length;
      const vagueCount = counts.vague_language || 0;
      let tone = 'Constructive';
      if (vagueCount >= 2 && posCount < 3) tone = 'Vague';
      else if (negCount > posCount) tone = 'Critical';

      const categories = {};
      for (const [cat, keywords] of Object.entries(FEEDBACK_CATEGORIES)) {
        categories[cat] = keywords.filter(kw => lower.includes(kw)).length;
      }

      return { biasScore, biasFlags: flags, biasType, tone, categories, sentiment: computeSentiment(text) };
    }

    function simulateML(record) {
      const raw = record.tenureScore * 0.3 + record.kpiScore * 0.5 + record.peerScore * 0.2;
      const predicted = Math.round((raw * 4 + 1) * 10) / 10;
      const deviation = Math.round((record.rating - predicted) * 10) / 10;
      return { predictedRating: predicted, ratingDeviation: deviation, flagged: Math.abs(deviation) > 0.8 };
    }

    function generateDebias(text) {
      let result = text;
      const entries = Object.entries(DEBIAS_MAP).sort((a, b) => b[0].length - a[0].length);
      for (const [biased, neutral] of entries) {
        const escaped = biased.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`\\b${escaped}\\b`, 'gi');
        result = result.replace(regex, neutral);
      }
      return result;
    }

    function computeFairnessMetrics(evaluations) {
      const male   = evaluations.filter(e => e.gender === 'Male');
      const female = evaluations.filter(e => e.gender === 'Female');
      if (!male.length || !female.length) return {};

      const avg = arr => arr.reduce((s, e) => s + e.rating, 0) / arr.length;
      const tpr = arr => arr.filter(e => e.rating >= 4).length / arr.length;

      const maleAvg  = avg(male),  femaleAvg  = avg(female);
      const maleTPR  = tpr(male),  femaleTPR  = tpr(female);

      return {
        maleAvg, femaleAvg,
        demographicParityDiff: Math.abs(maleAvg - femaleAvg),
        disparateImpactRatio:  femaleAvg / maleAvg,
        equalOpportunityDiff:  Math.abs(maleTPR - femaleTPR),
        maleTPR, femaleTPR,
      };
    }

    function processRecord(raw) {
      const nlp = analyzeNLP(raw.feedback);
      const ml  = simulateML(raw);
      return { ...raw, ...nlp, ...ml };
    }

    function ChartCanvas({ chartData, chartType, chartOptions = {}, height = 280 }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);
      const dataKey   = JSON.stringify(chartData);

      const optKey = JSON.stringify(chartOptions);
      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: chartType,
          data: chartData,
          options: { responsive: true, maintainAspectRatio: false, ...chartOptions },
        });
        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [dataKey, chartType, optKey]);

      return <div style={{ position: 'relative', height: height + 'px' }}><canvas ref={canvasRef} /></div>;
    }

    function BiasGauge({ score }) {
      const R = 65, cx = 85, cy = 80, sw = 12;
      const C = Math.PI * R;
      const offset = C * (1 - score / 100);
      const color = score <= 30 ? '#22c55e' : score <= 60 ? '#f59e0b' : '#ef4444';
      const label = score <= 30 ? 'Low Risk' : score <= 60 ? 'Medium Risk' : 'High Risk';
      const d = `M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}`;
      return (
        <div style={{ textAlign: 'center' }}>
          <svg width="170" height="95" viewBox="0 0 170 95">
            <path d={d} fill="none" stroke="#e2e8f0" strokeWidth={sw} />
            <path d={d} fill="none" stroke={color} strokeWidth={sw}
              strokeDasharray={C} strokeDashoffset={offset} strokeLinecap="round" />
            <text x={cx} y={cy - 4} textAnchor="middle" fontSize="22" fontWeight="700" fill={color}>{score}</text>
            <text x={cx} y={cy + 14} textAnchor="middle" fontSize="11" fill="#64748b">{label}</text>
          </svg>
          <div style={{ fontSize: '12px', color: '#64748b', marginTop: '-4px' }}>Bias Risk Score</div>
        </div>
      );
    }

    function HighlightedFeedback({ text, flags }) {
      if (!text) return null;
      if (!flags || flags.length === 0) return <span style={{ lineHeight: '1.7' }}>{text}</span>;

      const parts = [];
      let last = 0;
      for (const f of flags) {
        if (f.startIndex < last) continue;  // skip overlapping flag — first flag takes priority
        if (f.startIndex > last) parts.push(<span key={`t-${last}`}>{text.slice(last, f.startIndex)}</span>);
        parts.push(
          <span key={`f-${f.startIndex}`} className="tooltip-container"
            style={{ backgroundColor: f.color, borderBottom: `2px solid ${f.borderColor}`,
              padding: '0 2px', borderRadius: '2px', cursor: 'help' }}>
            {text.slice(f.startIndex, f.endIndex)}
            <span className="tooltip-text"><strong>{f.label}</strong><br />{f.explanation}</span>
          </span>
        );
        last = f.endIndex;
      }
      if (last < text.length) parts.push(<span key="t-end">{text.slice(last)}</span>);
      return <span style={{ lineHeight: '1.8' }}>{parts}</span>;
    }

              const arr = evaluations.filter(e => e.gender === g);
              if (!arr.length) return 0;
              return parseFloat((arr.reduce((s,e) => s + e.sentiment, 0) / arr.length).toFixed(3));
            }),
          }],
        };
      }, [evaluations]);

      // 4. Heatmap: ethnicity rows × department cols, value = deviation from company mean

      return (

    // ══════════════════════════════════════════════
    // MODULE 5 — FAIRNESS-AWARE FRAMEWORK PANEL
    // ══════════════════════════════════════════════

    const CONSTRAINT_DEFS = [
      { key:'dp',  label:'Demographic Parity Constraint',
        desc:'Forces equal average predicted outcomes across gender groups, penalising models that produce systematically different predictions for different demographic groups.' },
      { key:'eo',  label:'Equalized Odds',
        desc:'Requires equal true positive and false positive rates across groups. Prevents the model from being simultaneously accurate for one group and inaccurate for another.' },
      { key:'if_', label:'Individual Fairness',
        desc:'Similar individuals should receive similar predictions regardless of their demographic group. Reduces reliance on group-level attributes in decision-making.' },
      { key:'cal', label:'Calibration',
        desc:'Predicted probabilities should reflect true outcome frequencies equally across groups. Prevents systematic over- or under-confidence for specific demographics.' },
    ];

    function FairnessFramework({ evaluations }) {
      const [reweighted, setReweighted] = React.useState(false);
      const [constraints, setConstraints] = React.useState({ dp:false, eo:false, if_:false, cal:false });
      const [thresholds, setThresholds] = React.useState({ Male:0.5, Female:0.5, 'Non-binary':0.5 });
      const [auditResolution, setAuditResolution] = React.useState({});

      const toggleConstraint = (key) => setConstraints(c => ({ ...c, [key]: !c[key] }));
      const activeCount = Object.values(constraints).filter(Boolean).length;
      const modelAccuracy = (84 + activeCount * 1.5 - (activeCount > 2 ? 2 : 0)).toFixed(1);

      const genderCounts = useMemo(() => {
        const actual = {};
        GENDERS.forEach(g => { actual[g] = evaluations.filter(e => e.gender === g).length; });
        const target = Math.round(evaluations.length / 3);
        const balanced = { Male: target, Female: target, 'Non-binary': target };
        return { actual, balanced };
      }, [evaluations]);

      const genderDistData = (data) => ({
        labels: GENDERS,
        datasets: [{
          label: 'Count',
          backgroundColor: ['#3b82f6cc','#ec4899cc','#8b5cf6cc'],
          data: GENDERS.map(g => data[g] || 0),
        }],
      });

      const outcomeRates = useMemo(() => {
        return Object.fromEntries(
          GENDERS.map(g => {
            const arr = evaluations.filter(e => e.gender === g);
            const baseRate = arr.filter(e => e.rating >= 4).length / (arr.length || 1);
            const t = thresholds[g];
            const adjusted = Math.max(0, Math.min(1, baseRate + (0.5 - t) * 0.8));
            return [g, adjusted];
          })
        );
      }, [evaluations, thresholds]);

      const flagged = useMemo(() => evaluations.filter(e => e.flagged).slice(0,15), [evaluations]);

      const severityLabel = (e) => {
        const abs = Math.abs(e.ratingDeviation);
        if (abs >= 2.0) return { text:'High',   color:'#ef4444', bg:'#fee2e2' };
        if (abs >= 1.0) return { text:'Medium', color:'#f59e0b', bg:'#fef9c3' };
        return             { text:'Low',    color:'#22c55e', bg:'#dcfce7' };
      };

      const pipelineStepStyle = (active) => ({
        background: '#fff', borderRadius:'10px', padding:'16px',
        border: `2px solid ${active ? '#14b8a6' : '#e2e8f0'}`,
      });
      const arrowStyle = { display:'flex', alignItems:'center', justifyContent:'center', fontSize:'22px', color:'#14b8a6' };

      return (
        <div style={{ padding:'24px' }}>
          <h2 style={{ margin:'0 0 20px', fontSize:'20px', color:'#1e293b' }}>📋 Fairness-Aware Framework</h2>

          <Card title="Bias Mitigation Pipeline">
            <div style={{ display:'grid', gridTemplateColumns:'1fr 32px 1fr 32px 1fr', alignItems:'start', gap:'0' }}>

              <div style={pipelineStepStyle(reweighted)}>
                <div style={{ fontSize:'13px', fontWeight:700, color:'#14b8a6', marginBottom:'8px',
                  textTransform:'uppercase', letterSpacing:'0.5px' }}>① Pre-processing</div>
                <div style={{ marginBottom:'12px' }}>
                  <ChartCanvas
                    chartData={genderDistData(reweighted ? genderCounts.balanced : genderCounts.actual)}
                    chartType="bar"
                    chartOptions={{ scales: { y: { beginAtZero:true } },
                      plugins: { legend:{ display:false } } }}
                    height={140} />
                </div>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <span style={{ fontSize:'12px', color:'#64748b' }}>Data Reweighting:</span>
                  <button onClick={() => setReweighted(r => !r)}
                    style={{ background: reweighted ? '#14b8a6' : '#f1f5f9',
                      color: reweighted ? '#fff' : '#374151',
                      border:'none', borderRadius:'6px', padding:'5px 12px',
                      fontSize:'12px', cursor:'pointer', fontWeight:600 }}>
                    {reweighted ? '✅ Applied' : 'Apply'}
                  </button>
                </div>
              </div>

              <div style={arrowStyle}>→</div>

              <div style={pipelineStepStyle(activeCount > 0)}>
                <div style={{ fontSize:'13px', fontWeight:700, color:'#14b8a6', marginBottom:'8px',
                  textTransform:'uppercase', letterSpacing:'0.5px' }}>② In-processing</div>
                {CONSTRAINT_DEFS.map(c => (
                  <div key={c.key} style={{ display:'flex', alignItems:'flex-start', gap:'8px',
                    marginBottom:'10px', padding:'8px', background:'#f8fafc', borderRadius:'6px' }}>
                    <input type="checkbox" checked={constraints[c.key]}
                      onChange={() => toggleConstraint(c.key)}
                      style={{ marginTop:'2px', cursor:'pointer', accentColor:'#14b8a6' }} />
                    <div>
                      <div style={{ fontSize:'13px', fontWeight:600, color:'#374151' }}>{c.label}</div>
                      <div style={{ fontSize:'10px', color:'#64748b', lineHeight:'1.4',
                        display:'-webkit-box', WebkitLineClamp:'3', WebkitBoxOrient:'vertical', overflow:'hidden' }}>{c.desc}</div>
                    </div>
                  </div>
                ))}
                <div style={{ background:'#f0fdf4', borderRadius:'6px', padding:'8px 12px',
                  fontSize:'13px', marginTop:'8px' }}>
                  Simulated model accuracy: <strong style={{ color:'#22c55e' }}>{modelAccuracy}%</strong>
                </div>
              </div>

              <div style={arrowStyle}>→</div>

              <div style={pipelineStepStyle(Object.values(thresholds).some(t => t !== 0.5))}>
                <div style={{ fontSize:'13px', fontWeight:700, color:'#14b8a6', marginBottom:'8px',
                  textTransform:'uppercase', letterSpacing:'0.5px' }}>③ Post-processing</div>
                <p style={{ fontSize:'12px', color:'#64748b', marginTop:0 }}>
                  Adjust decision thresholds per demographic group. Higher threshold = fewer high-rating outcomes.
                </p>
                {GENDERS.map(g => (
                  <div key={g} style={{ marginBottom:'12px' }}>
                    <div style={{ fontSize:'12px', fontWeight:600, color:'#374151', marginBottom:'2px',
                      whiteSpace:'nowrap' }}>{g}</div>
                    <div style={{ fontSize:'11px', color:'#14b8a6', marginBottom:'4px' }}>
                      t={thresholds[g].toFixed(2)} → {(outcomeRates[g] * 100).toFixed(0)}% outcome
                    </div>
                    <input type="range" min="0.3" max="0.7" step="0.05"
                      value={thresholds[g]}
                      onChange={e => setThresholds(t => ({ ...t, [g]: parseFloat(e.target.value) }))}
                      style={{ width:'100%', accentColor:'#14b8a6' }} />
                  </div>
                ))}
              </div>
            </div>
          </Card>

          <Card title="Audit Log — Flagged Evaluations">
            <div style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'13px' }}>
                <thead>
                  <tr style={{ background:'#f8fafc' }}>
                    {['ID','Evaluator','Dept','Timestamp','Bias Type','Severity','Resolution'].map(h => (
                      <th key={h} style={{ padding:'9px 12px', textAlign:'left', fontSize:'12px',
                        fontWeight:600, color:'#64748b', borderBottom:'2px solid #e2e8f0' }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {flagged.map(e => {
                    const sev = severityLabel(e);
                    const resKey = e.id;
                    return (
                      <tr key={e.id} style={{ borderBottom:'1px solid #f1f5f9' }}>
                        <td style={{ padding:'9px 12px' }}><strong>{e.id}</strong></td>
                        <td style={{ padding:'9px 12px' }}>{e.evaluatorId}</td>
                        <td style={{ padding:'9px 12px' }}>{e.department}</td>
                        <td style={{ padding:'9px 12px', color:'#64748b' }}>{e.timestamp}</td>
                        <td style={{ padding:'9px 12px' }}>
                          <span style={{ fontSize:'12px', color: e.biasType === 'None' ? '#22c55e' : '#ef4444' }}>
                            {e.biasType !== 'None' ? e.biasType : (Math.abs(e.ratingDeviation) >= 1.5 ? 'Systemic' : 'Statistical')}
                          </span>
                        </td>
                        <td style={{ padding:'9px 12px' }}>
                          <span style={{ background:sev.bg, color:sev.color, borderRadius:'10px',
                            padding:'2px 8px', fontSize:'12px', fontWeight:600 }}>{sev.text}</span>
                        </td>
                        <td style={{ padding:'9px 12px' }}>
                          <select
                            value={auditResolution[resKey] || 'Pending'}
                            onChange={e2 => setAuditResolution(r => ({ ...r, [resKey]: e2.target.value }))}
                            style={{ padding:'4px 8px', borderRadius:'5px', border:'1px solid #e2e8f0',
                              fontSize:'12px', background:'#fff' }}>
                            <option>Pending</option>
                            <option>Under Review</option>
                            <option>Resolved</option>
                          </select>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    // MODULE 6 — XAI EXPLAINABILITY VIEW
    // ══════════════════════════════════════════════

    function XAIView({ evaluations, selectedEvaluationId, setSelectedEvaluationId }) {
      const flagged = useMemo(() => evaluations.filter(e => e.flagged), [evaluations]);
      const [chosenId, setChosenId] = React.useState(null);

      useEffect(() => {
        if (selectedEvaluationId) setChosenId(selectedEvaluationId);
        else if (flagged.length > 0 && !chosenId) setChosenId(flagged[0].id);
      }, [selectedEvaluationId, flagged]);

      const record = useMemo(() =>
        evaluations.find(e => e.id === chosenId), [evaluations, chosenId]);

      const featureImportance = useMemo(() => {
        if (!record) return null;
        const abs = Math.abs(record.ratingDeviation);
        return [
          { label:'Rating Deviation',     value: Math.min(1, abs / 2.5),           color:'#ef4444' },
          { label:'Evaluator Pattern',     value: record.evaluatorId === 'MGR-C' ? 0.88 : record.evaluatorId === 'MGR-A' ? 0.82 : 0.78, color:'#f97316' },
          { label:'Sentiment Score',       value: Math.min(1, Math.abs(record.sentiment) + 0.2), color:'#f59e0b' },
          { label:'Keyword Bias Density',  value: Math.min(1, record.biasScore / 100), color:'#8b5cf6' },
          { label:'Demographic Attribute', value: (record.gender === 'Female' && record.evaluatorId === 'MGR-C') ? 0.75 : 0.3, color:'#ec4899' },
          { label:'Department Context',    value: 0.25, color:'#3b82f6' },
        ].sort((a, b) => b.value - a.value);
      }, [record]);

      const fiChartData = useMemo(() => featureImportance ? ({
        labels: featureImportance.map(f => f.label),
        datasets: [{
          label: 'Importance Score',
          data: featureImportance.map(f => parseFloat(f.value.toFixed(3))),
          backgroundColor: featureImportance.map(f => f.color + 'cc'),
          borderColor:     featureImportance.map(f => f.color),
          borderWidth: 1,
        }],
      }) : null, [featureImportance]);

      const buildExplanation = (r) => {
        if (!r) return '';
        const parts = [];
        if (Math.abs(r.ratingDeviation) > 0.8)
          parts.push(`The actual rating (${r.rating}) deviates ${r.ratingDeviation > 0 ? 'above' : 'below'} the KPI-predicted rating (${r.predictedRating}) by ${Math.abs(r.ratingDeviation)} points.`);
        if (r.evaluatorId === 'MGR-C' && r.gender === 'Female')
          parts.push(`Evaluator MGR-C shows a systematic pattern of rating female employees significantly below their KPI-predicted scores while rating male employees with equivalent KPIs at or above prediction.`);
        if (r.biasScore > 30)
          parts.push(`The written feedback contains ${r.biasFlags.length} flagged phrase(s) — including ${r.biasFlags.slice(0,2).map(f => `"${f.phrase}"`).join(' and ')} — which ${r.biasFlags[0]?.label.toLowerCase() || 'indicate potential bias'}.`);
        if (r.sentiment < -0.1)
          parts.push(`The feedback sentiment score is negative (${r.sentiment.toFixed(2)}), which is disproportionately low compared to the overall dataset mean for this department.`);
        return parts.length > 0 ? parts.join(' ') : `This evaluation was flagged because the actual rating deviates significantly (${r.ratingDeviation > 0 ? '+' : ''}${r.ratingDeviation}) from the objective KPI-based prediction (${r.predictedRating}).`;
      };

      return (
        <div style={{ padding:'24px', maxWidth:'1000px' }}>
          <h2 style={{ margin:'0 0 20px', fontSize:'20px', color:'#1e293b' }}>📈 XAI Explainability View</h2>

          {flagged.length === 0 ? (
            <Card><p style={{ color:'#64748b' }}>No flagged evaluations to explain. Run the ML Predictor first.</p></Card>
          ) : (
            <>
              <Card>
                <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
                  <label style={{ fontSize:'13px', fontWeight:600, color:'#374151' }}>
                    Select flagged evaluation:
                  </label>
                  <select
                    value={chosenId || ''}
                    onChange={e => { setChosenId(e.target.value); setSelectedEvaluationId(e.target.value); }}
                    style={{ padding:'7px 12px', borderRadius:'6px', border:'1px solid #e2e8f0',
                      fontSize:'14px', minWidth:'200px' }}>
                    {flagged.map(e => (
                      <option key={e.id} value={e.id}>
                        {e.id} — {e.evaluatorId} | {e.department} | Dev: {e.ratingDeviation > 0 ? '+' : ''}{e.ratingDeviation}
                      </option>
                    ))}
                  </select>
                  {record && (
                    <span style={{ marginLeft:'auto', fontSize:'13px', color:'#64748b' }}>
                      Employee: <strong>{record.employeeId}</strong> | Gender: <strong>{record.gender}</strong> | Ethnicity: <strong>{record.ethnicity}</strong>
                    </span>
                  )}
                </div>
              </Card>

              {record && (
                <>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'20px' }}>
                    <Card title="Feature Importance">
                      <ChartCanvas chartData={fiChartData} chartType="bar"
                        chartOptions={{ indexAxis:'y',
                          scales: { x: { min:0, max:1, title:{ display:true, text:'Importance Score (0–1)' } } },
                          plugins: { legend:{ display:false } } }}
                        height={220} />
                    </Card>
                    <Card title="Plain-Language Explanation">
                      <div style={{ background:'#fff7ed', border:'1px solid #fdba74', borderRadius:'8px',
                        padding:'16px', fontSize:'14px', lineHeight:'1.8', color:'#1e293b' }}>
                        {buildExplanation(record)}
                      </div>
                      <div style={{ marginTop:'12px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px' }}>
                        {[['Actual Rating', record.rating, '#3b82f6'],
                          ['Predicted',     record.predictedRating, '#8b5cf6'],
                          ['Deviation',     (record.ratingDeviation > 0 ? '+' : '') + record.ratingDeviation,
                            record.ratingDeviation > 0 ? '#22c55e' : '#ef4444'],
                          ['Bias Score',    record.biasScore + '/100', record.biasScore > 60 ? '#ef4444' : '#f59e0b'],
                        ].map(([l,v,c]) => (
                          <div key={l} style={{ background:'#f8fafc', borderRadius:'6px', padding:'8px 12px' }}>
                            <div style={{ fontSize:'11px', color:'#94a3b8' }}>{l}</div>
                            <div style={{ fontSize:'18px', fontWeight:700, color:c }}>{v}</div>
                          </div>
                        ))}
                      </div>
                    </Card>
                  </div>

                  <Card title="Original vs. Debiased Feedback">
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px' }}>
                      <div>
                        <div style={{ fontSize:'12px', fontWeight:600, color:'#ef4444', marginBottom:'8px',
                          textTransform:'uppercase', letterSpacing:'0.5px' }}>Original</div>
                        <div style={{ background:'#fff7f7', border:'1px solid #fecaca', borderRadius:'8px',
                          padding:'14px', fontSize:'14px', lineHeight:'1.8', color:'#1e293b' }}>
                          <HighlightedFeedback text={record.feedback} flags={record.biasFlags} />
                        </div>
                      </div>
                      <div>
                        <div style={{ fontSize:'12px', fontWeight:600, color:'#22c55e', marginBottom:'8px',
                          textTransform:'uppercase', letterSpacing:'0.5px' }}>Debiased</div>
                        <div style={{ background:'#f0fdf4', border:'1px solid #86efac', borderRadius:'8px',
                          padding:'14px', fontSize:'14px', lineHeight:'1.8', color:'#1e293b' }}>
                          {generateDebias(record.feedback)}
                        </div>
                      </div>
                    </div>
                  </Card>
                </>
              )}
            </>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════
    // APP SHELL
    // ══════════════════════════════════════════════

    const NAV_ITEMS = [
      { id: 1, icon: '📝', label: 'Evaluation Form' },
      { id: 2, icon: '📊', label: 'Analytics Dashboard' },
      { id: 3, icon: '🤖', label: 'ML Bias Predictor' },
      { id: 4, icon: '🔍', label: 'NLP Analyzer' },
      { id: 5, icon: '📋', label: 'Fairness Framework' },
      { id: 6, icon: '📈', label: 'XAI Explainability' },
    ];

    function TopNav({ evaluations, onGenerateReport }) {
      const alertCount = evaluations ? evaluations.filter(e => e.flagged).length : 0;
      return (
        <div style={{ background: '#0f172a', height: '56px', display: 'flex', alignItems: 'center',
          padding: '0 24px', position: 'fixed', top: 0, left: 0, right: 0, zIndex: 50,
          borderBottom: '1px solid #1e293b' }}>
          <span style={{ color: '#14b8a6', fontWeight: 700, fontSize: '16px', letterSpacing: '-0.3px' }}>
            ⚖ HR Bias Detection System
          </span>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '16px' }}>
            <span style={{ color: '#94a3b8', fontSize: '13px' }}>HR Manager</span>
            {alertCount > 0 && (
              <span style={{ background: '#ef4444', color: '#fff', borderRadius: '12px',
                padding: '2px 9px', fontSize: '12px', fontWeight: 600 }}>
                {alertCount} Alerts
              </span>
            )}
            <button
              onClick={onGenerateReport}
              style={{ background: '#14b8a6', color: '#fff', border: 'none', borderRadius: '6px',
                padding: '6px 14px', fontSize: '13px', cursor: 'pointer', fontWeight: 500 }}>
              Generate Report
            </button>
          </div>
        </div>
      );
    }

    function SidebarButton({ item, activeModule, setActiveModule }) {
      const [hovered, setHovered] = React.useState(false);
      const isActive = activeModule === item.id;
      return (
        <button
          onClick={() => setActiveModule(item.id)}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          style={{
            display: 'flex', alignItems: 'center', gap: '10px', width: '100%',
            padding: '10px 16px', border: 'none', cursor: 'pointer', textAlign: 'left',
            background: isActive ? '#14b8a620' : hovered ? '#ffffff0f' : 'transparent',
            color: isActive ? '#14b8a6' : hovered ? '#e2e8f0' : '#94a3b8',
            borderRight: isActive ? '3px solid #14b8a6' : '3px solid transparent',
            fontSize: '14px', transition: 'all 0.15s',
          }}>
          <span>{item.icon}</span>
          <span style={{ fontWeight: isActive ? 600 : 400 }}>{item.label}</span>
        </button>
      );
    }

    function Sidebar({ activeModule, setActiveModule }) {
      return (
        <div style={{ background: '#0f172a', width: '240px', minHeight: '100vh', paddingTop: '72px',
          position: 'fixed', left: 0, top: 0, borderRight: '1px solid #1e293b' }}>
          {NAV_ITEMS.map(item => (
            <SidebarButton key={item.id} item={item} activeModule={activeModule} setActiveModule={setActiveModule} />
          ))}
        </div>
      );
    }

    function App() {
      const [activeModule, setActiveModule] = useState(1);
      const [evaluations, setEvaluations] = useState(typeof INITIAL_EVALUATIONS !== 'undefined' ? INITIAL_EVALUATIONS : []);
      const [selectedEvaluationId, setSelectedEvaluationId] = useState(null);

      function generateReport() {
        if (evaluations.length === 0) {
          alert('No evaluations to report. Load or submit at least one evaluation first.');
          return;
        }
        const flagged = evaluations.filter(e => e.flagged);
        const metrics = typeof computeFairnessMetrics !== 'undefined' ? computeFairnessMetrics(evaluations) : {};
        const date = new Date().toISOString().split('T')[0];
        const lines = [
          '═══════════════════════════════════════════════════',
          '   HR BIAS DETECTION SYSTEM — FAIRNESS REPORT',
          `   Generated: ${date}`,
          '═══════════════════════════════════════════════════',
          '',
          `Total Evaluations Analysed: ${evaluations.length}`,
          `Flagged for Bias: ${flagged.length} (${evaluations.length ? Math.round(flagged.length / evaluations.length * 100) : 0}%)`,
          '',
          '── FAIRNESS METRICS ──────────────────────────────',
          `Demographic Parity Difference : ${metrics.demographicParityDiff?.toFixed(2) ?? 'N/A'}  (threshold < 0.20)`,
          `Disparate Impact Ratio        : ${metrics.disparateImpactRatio?.toFixed(2) ?? 'N/A'}  (threshold >= 0.80)`,
          `Equal Opportunity Difference  : ${metrics.equalOpportunityDiff?.toFixed(2) ?? 'N/A'}  (threshold < 0.10)`,
          '',
          '── EVALUATOR SUMMARY ────────────────────────────',
          ...EVALUATORS.map(mgr => {
            const evals = evaluations.filter(e => e.evaluatorId === mgr);
            const avgRating = evals.length ? (evals.reduce((s, e) => s + e.rating, 0) / evals.length).toFixed(2) : 'N/A';
            const flaggedCount = evals.filter(e => e.flagged).length;
            return `${mgr}: ${evals.length} evaluations, avg rating ${avgRating}, ${flaggedCount} flagged`;
          }),
          '',
          '── DEPARTMENT SUMMARY ───────────────────────────',
          ...DEPARTMENTS.map(dept => {
            const evals = evaluations.filter(e => e.department === dept);
            const avg = evals.length ? (evals.reduce((s, e) => s + e.rating, 0) / evals.length).toFixed(2) : 'N/A';
            return `${dept}: avg rating ${avg} (${evals.length} evaluations)`;
          }),
          '',
          '── FLAGGED EVALUATIONS ──────────────────────────',
          ...flagged.map(e =>
            `${e.id} | ${e.evaluatorId} | ${e.department} | Rating: ${e.rating} | Predicted: ${e.predictedRating} | Dev: ${e.ratingDeviation > 0 ? '+' : ''}${e.ratingDeviation}`
          ),
          '',
          '═══════════════════════════════════════════════════',
        ];
        const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bias-report-${date}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }

      const navigateToXAI = (id) => {
        setSelectedEvaluationId(id);
        setActiveModule(6);
      };

      const renderModule = () => {
        if (activeModule === 1) return <EvaluationForm evaluations={evaluations} setEvaluations={setEvaluations} />;
        if (activeModule === 2) return <AnalyticsDashboard evaluations={evaluations} />;
        if (activeModule === 3) return <MLPredictor evaluations={evaluations} navigateToXAI={navigateToXAI} />;
        if (activeModule === 4) return <NLPAnalyzer />;
        if (activeModule === 5) return <FairnessFramework evaluations={evaluations} />;
        if (activeModule === 6) return <XAIView evaluations={evaluations} selectedEvaluationId={selectedEvaluationId} setSelectedEvaluationId={setSelectedEvaluationId} />;
        return null;
      };

      return (
        <div>
          <TopNav evaluations={evaluations} onGenerateReport={generateReport} />
          <Sidebar activeModule={activeModule} setActiveModule={setActiveModule} />
          <div style={{ marginLeft: '240px', paddingTop: '56px', minHeight: '100vh' }}>
            {renderModule()}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
